<!DOCTYPE html>
<html lang="es" data-radius="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrenos Vales</title>
<meta name="description" content="Registro de entrenos por microciclos: remo, carrera y más, con datos y gráficas de cada sesión.">
<meta name="theme-color" content="#f7f9fa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..700&family=Funnel+Sans:wght@400..600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Paleta "Frost and slate" + tipografía Funnel (repartidas con tasteskill, perfil software).
   Layout: cabecera con totales -> temporada (un gráfico con todos los microciclos, se pincha para elegir)
   -> microciclo elegido (selector, cifras con comparación, carga diaria, días y sesiones desplegables). */
:root{
  --bg:#f7f9fa;--surface:#ffffff;--sunk:#ecf0f2;--ink:#1f3038;--muted:#5d6b72;--line:#d9e0e4;
  --accent:#0d7480;--accent-ink:#ffffff;--up:#2f7d4f;--down:#b4472f;
  --s-water:#1e6fb8;--s-erg:#c2416b;--s-run:#d4622a;--s-hike:#5a8f3c;--s-bike:#c4961a;--s-other:#7d8b93;
  --font-display:"Funnel Display",system-ui,sans-serif;
  --font-text:"Funnel Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-s:6px;--r-m:10px;--r-l:14px;
  --ease:cubic-bezier(.2,.8,.2,1);--ease-enter:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121b20;--surface:#1a262d;--sunk:#152026;--ink:#eef2f4;--muted:#9ea9ae;--line:#2a3a42;
  --accent:#4fb3bd;--accent-ink:#0f1a1e;--up:#5fc38a;--down:#ef8a6f;
  --s-water:#4d9ae0;--s-erg:#e36d93;--s-run:#ef8752;--s-hike:#86bd66;--s-bike:#e3b947;--s-other:#9aa7ae;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121b20;--surface:#1a262d;--sunk:#152026;--ink:#eef2f4;--muted:#9ea9ae;--line:#2a3a42;
  --accent:#4fb3bd;--accent-ink:#0f1a1e;--up:#5fc38a;--down:#ef8a6f;
  --s-water:#4d9ae0;--s-erg:#e36d93;--s-run:#ef8752;--s-hike:#86bd66;--s-bike:#e3b947;--s-other:#9aa7ae;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.num,.tile b,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.86em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:var(--r-s);z-index:10}
.skip:focus{top:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabecera */
.top{padding-top:36px;padding-bottom:22px}
.top h1{font-family:var(--font-display);font-weight:500;font-size:clamp(40px,6vw,68px);letter-spacing:-.04em;line-height:.95;margin:0}
.season-stats{display:flex;flex-wrap:wrap;gap:10px 34px;margin-top:22px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--font-display);font-weight:500;font-size:28px;letter-spacing:-.02em}
.stat b small{font-family:var(--font-text);font-size:13px;font-weight:400;color:var(--muted);margin-left:3px;letter-spacing:0}
@media (prefers-reduced-motion:no-preference){
  .enter{opacity:0;transform:translateY(10px);animation:enter .7s var(--ease-enter) forwards}
  .enter.d1{animation-delay:.12s}.enter.d2{animation-delay:.24s}
  @keyframes enter{to{opacity:1;transform:none}}
}

/* bloques */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px 22px;margin-bottom:18px}
.block-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
h2{font-family:var(--font-display);font-weight:500;font-size:30px;letter-spacing:-.025em;margin:0}
.hint{font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.season-scroll{overflow-x:auto}
.season-cv{position:relative;height:240px;min-width:560px}

/* selector de microciclo */
.mc-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  transition:transform 150ms var(--ease),background-color 150ms var(--ease),border-color 150ms var(--ease)}
.btn:disabled{opacity:.4;cursor:default}
@media (hover:hover) and (pointer:fine){.btn:not(:disabled):hover{transform:translateY(-1px);border-color:var(--ink);background:var(--sunk)}}
.btn:not(:disabled):active{transform:translateY(1px) scale(.985);transition-duration:90ms}
.btn svg{width:16px;height:16px}
select.btn{padding-right:34px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;min-width:240px}
.sel-wrap{display:flex;align-items:center;gap:8px}
.sel-label{font-size:13px;color:var(--muted)}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.mc-card{font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:64px;padding:9px 11px 10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);color:var(--ink);
  transition:transform 180ms var(--ease),border-color 150ms var(--ease),background-color 150ms var(--ease)}
.mc-card b{font-family:var(--font-display);font-weight:500;font-size:17px;display:flex;align-items:center;gap:6px}
.mc-card span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mc-card .meter{display:block;height:3px;border-radius:2px;background:var(--sunk);margin-top:5px;overflow:hidden}
.mc-card .meter i{display:block;height:100%;background:var(--accent)}
.mc-card .live{width:7px;height:7px;border-radius:50%;background:var(--accent)}
@media (hover:hover) and (pointer:fine){.mc-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}}
.mc-card:active{transform:translateY(1px) scale(.985)}
.mc-card[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mc-card[aria-pressed="true"] span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.mc-card[aria-pressed="true"] .meter{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.mc-card[aria-pressed="true"] .meter i,.mc-card[aria-pressed="true"] .live{background:var(--bg)}
.mc-card .short{display:none}
@media (max-width:520px){.mc-grid{grid-template-columns:repeat(4,1fr);gap:6px}.mc-card{min-height:52px;padding:7px 8px 8px}.mc-card b{font-size:15px}.mc-card .full{display:none}.mc-card .short{display:block;font-size:11px}}
.mc-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 16px}
.mc-title{line-height:1.1}
.mc-dates{color:var(--muted);margin-top:4px}
.pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-left:8px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sunk);border-radius:var(--r-m);padding:10px 12px}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{font-family:var(--font-display);font-weight:500;font-size:24px;letter-spacing:-.01em;line-height:1.15}
.tile b small{font-family:var(--font-text);font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.delta{display:block;font-size:12px;margin-top:2px;color:var(--muted)}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{display:flex;align-items:center;gap:7px;font-size:13px;border:1px solid var(--line);border-radius:var(--r-s);padding:5px 10px;font-variant-numeric:tabular-nums}
.week-cv{position:relative;height:170px;width:100%;min-width:0}
.block,main{min-width:0}
canvas{max-width:100%}

/* días y sesiones */
.day{margin-top:20px}
.day-h{display:flex;gap:10px;align-items:baseline;margin:0 0 8px}
.day h3{font-family:var(--font-display);font-weight:500;font-size:18px;letter-spacing:-.01em;margin:0}
.day-h span{font-size:13px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px}
details.act{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);transition:border-color 150ms var(--ease),transform 180ms var(--ease)}
@media (hover:hover) and (pointer:fine){details.act:not([open]):hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}}
details.act[open]{background:var(--sunk);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
details.act>summary{display:grid;grid-template-columns:4px minmax(130px,1.4fr) repeat(5,minmax(76px,1fr)) 18px;gap:12px;align-items:center;padding:10px 14px 10px 10px;min-height:56px;font-size:14px;font-variant-numeric:tabular-nums}
.bar{width:4px;height:34px;border-radius:2px}
.a-name{font-weight:600}
.a-name small,.a-cell small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.chev{width:16px;height:16px;color:var(--muted);transition:transform 150ms var(--ease)}
details[open]>summary .chev{transform:rotate(90deg)}
.nodata{color:var(--muted);font-style:italic}
.detail{padding:4px 16px 18px}
.gc-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--accent);text-decoration:none;min-height:44px;background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-position:0 calc(50% + 10px);background-repeat:no-repeat;transition:background-size 150ms var(--ease)}
@media (hover:hover) and (pointer:fine){.gc-link:hover{background-size:100% 1px}}
.gc-link svg{width:14px;height:14px;transition:transform 150ms var(--ease)}
@media (hover:hover) and (pointer:fine){.gc-link:hover svg{transform:translate(3px,-1px)}}
.dtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,122px),1fr));gap:8px;margin:2px 0 14px}
.dtiles .tile{background:var(--surface);border:1px solid var(--line)}
.dtiles .tile b{font-size:21px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:10px}
.chart{min-width:0}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.chart h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--muted)}
.chart .cv{position:relative;height:150px}
.chart svg{width:100%;height:150px;display:block}
.laps{margin-top:14px;overflow-x:auto}
.laps h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:540px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
th{text-align:right;font-weight:500;color:var(--muted);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
.loading{color:var(--muted);padding:12px 0}
footer{padding:10px 0 50px;color:var(--muted);font-size:12.5px}
@media (max-width:820px){
  details.act>summary{grid-template-columns:4px 1fr 1fr 1fr 18px}
  details.act>summary .hide-sm{display:none}
}
@media (max-width:520px){
  .wrap{padding:0 16px}
  .block{padding:16px 14px}
  details.act>summary{grid-template-columns:4px 1.5fr .9fr 1.2fr 16px;gap:8px;padding:10px 10px 10px 10px}
  .a-name{white-space:nowrap}
  .a-cell small{white-space:nowrap;font-size:11px}
  details.act>summary .hide-xs{display:none}
  .mc-nav{width:100%;flex-wrap:nowrap}
  .sel-wrap{flex:1;min-width:0}
  .mc-nav>.btn{flex:none}
  select.btn{flex:1;min-width:0;width:100%}
  .stat b{font-size:24px}
  .detail{padding:2px 10px 14px}
  .dtiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .dtiles .tile{padding:7px 8px}
  .dtiles .tile span{font-size:10.5px;line-height:1.25;overflow-wrap:anywhere}
  .dtiles .tile b{font-size:17px}
  .dtiles .tile b small{font-size:10.5px;margin-left:2px}
  .chart{padding:8px 8px 6px}
  .chart .cv,.chart svg{height:140px}
  th,td{padding:6px 8px}
}
@media (max-width:330px){.dtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#mc">Ir al microciclo</a>
<header class="top wrap">
  <h1 class="enter">Entrenos Vales</h1>
  <div class="season-stats enter d1" id="season-stats" aria-live="polite"></div>
</header>
<main class="wrap">
  <section class="block enter d2" aria-labelledby="season-h">
    <div class="block-h"><h2 id="season-h">Temporada</h2><div class="legend" id="legend"></div></div>
    <div class="season-scroll"><div class="season-cv"><canvas id="season-cv" role="img" aria-label="Horas y carga de cada microciclo de la temporada"></canvas></div></div>
    <p class="hint" style="margin:8px 0 0;color:var(--ink)">Barras: horas por deporte. Línea: carga. Pincha una barra para abrir ese microciclo.</p>
  </section>

  <section class="block" aria-labelledby="pick-h">
    <div class="block-h"><h2 id="pick-h">Microciclos</h2></div>
    <div class="mc-grid" id="mc-grid" role="list"></div>
  </section>

  <section class="block" id="mc" aria-labelledby="mc-title" tabindex="-1">
    <div class="mc-head">
      <div>
        <h2 class="mc-title" id="mc-title">Microciclo</h2>
        <div class="mc-dates" id="mc-dates"></div>
      </div>
    </div>
    <div class="tiles" id="mc-tiles"></div>
    <div class="chips" id="mc-chips"></div>
    <div class="week-cv"><canvas id="week-cv" role="img" aria-label="Carga de entrenamiento por día"></canvas></div>
    <div id="mc-days"></div>
  </section>
</main>
<footer class="wrap" id="foot"></footer>

<script src="data/summary.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const SPORTS={
  water:{label:"Remo en agua",c:"--s-water",pace:500},
  erg:{label:"Remo indoor",c:"--s-erg",pace:500},
  run:{label:"Carrera",c:"--s-run",pace:1000},
  hike:{label:"Senderismo",c:"--s-hike"},
  mtb:{label:"BTT",c:"--s-bike"},
  bike:{label:"Ciclismo",c:"--s-bike"},
  other:{label:"Navegación",c:"--s-other"}
};
const ORDER=["water","erg","run","hike","mtb","bike","other"];
const DOW=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],DOWS=["L","M","X","J","V","S","D"];
const MON=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DAY=864e5;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dUTC=s=>{const[y,m,d]=s.slice(0,10).split("-").map(Number);return Date.UTC(y,m-1,d)};
const fd=t=>{const d=new Date(t);return d.getUTCDate()+" "+MON[d.getUTCMonth()]};
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`};
const hm=s=>{const m=Math.round(s/60),h=Math.floor(m/60);return h?`${h} h ${String(m%60).padStart(2,"0")}`:`${m} min`};
const nf=(x,d=0)=>x.toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d});
const kind=a=>a.sub==="indoor_rowing"?"erg":a.sport==="rowing"?"water":a.sport==="running"?"run":a.sport==="hiking"?"hike":a.sport==="cycling"?(a.sub==="mountain"?"mtb":"bike"):"other";
const isRow=k=>k==="water"||k==="erg";
const sum=(l,f)=>l.reduce((s,a)=>s+(f(a)||0),0);
const charts={};
function mkChart(key,cv,cfg){if(charts[key])charts[key].destroy();if(!window.Chart)return null;return charts[key]=new Chart(cv,cfg)}
function baseOpts(){const ink=css("--muted"),grid=css("--line");
  return{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:false},tooltip:{displayColors:false}},
    scales:{x:{ticks:{color:ink,maxTicksLimit:8,font:{size:10,family:css("--font-text")}},grid:{color:grid}},y:{ticks:{color:ink,font:{size:10}},grid:{color:grid}}}}}

let S,ACTS,WEEKS,cur,detCache={};
const today=new Date(),todayUTC=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());

Promise.resolve(window.__S).then(s=>{if(!s)throw new Error("faltan los datos (data/summary.js)");S=s;init()}).catch(e=>{document.getElementById("mc-days").innerHTML=`<p class="loading">No se pudieron cargar los datos (${e.message}). Recarga la página.</p>`});

function init(){
  const t0=dUTC(S.start);
  ACTS=S.acts.map(a=>({...a,k:kind(a)}));
  const last=Math.max(...ACTS.map(a=>a.mc),Math.floor((Math.min(todayUTC,dUTC(S.updated))-t0)/DAY/7)+1);
  WEEKS=Array.from({length:last},(_,i)=>({n:i+1,from:t0+i*7*DAY,to:t0+(i*7+6)*DAY,acts:[]}));
  ACTS.forEach(a=>WEEKS[a.mc-1]&&WEEKS[a.mc-1].acts.push(a));

  // totales de temporada
  const dist=k=>sum(ACTS.filter(a=>a.k===k),a=>a.dist)/1000;
  document.getElementById("season-stats").innerHTML=[
    ["Microciclos",WEEKS.length,""],["Sesiones",ACTS.length,""],["Tiempo",Math.round(sum(ACTS,a=>a.dur)/3600),"h"],
    ["Remo en agua",nf(dist("water"),0),"km"],["Remo indoor",nf(sum(ACTS.filter(a=>a.k==="erg"),a=>a.dur)/3600,1),"h"],["Carrera",nf(dist("run"),0),"km"],["Carga total",nf(Math.round(sum(ACTS,a=>a.load))),""]
  ].map(([l,v,u])=>`<div class="stat"><span>${l}</span><b>${v}${u?`<small>${u}</small>`:""}</b></div>`).join("");

  const used=ORDER.filter(k=>ACTS.some(a=>a.k===k));
  document.getElementById("legend").innerHTML=used.map(k=>`<span><i class="dot" style="background:var(${SPORTS[k].c})"></i>${SPORTS[k].label}</span>`).join("")+`<span><i class="dot" style="background:var(--ink);height:2px;border-radius:0"></i>Carga</span>`;

  const maxL=Math.max(1,...WEEKS.map(w=>sum(w.acts,a=>a.load)));
  const grid=document.getElementById("mc-grid");
  grid.innerHTML=WEEKS.map(w=>{const l=sum(w.acts,a=>a.load),live=todayUTC>=w.from&&todayUTC<=w.to;
    return `<button type="button" class="mc-card" role="listitem" data-n="${w.n}" aria-label="Microciclo ${w.n}, ${fd(w.from)} a ${fd(w.to)}, carga ${Math.round(l)}">
      <b>MC ${w.n}${live?'<i class="live" aria-hidden="true"></i>':""}</b><span class="full">${fd(w.from)} – ${fd(w.to)}</span><span class="short">${fd(w.from)}</span>
      <em class="meter" aria-hidden="true"><i style="width:${l/maxL*100}%"></i></em></button>`}).join("");
  grid.addEventListener("click",e=>{const b=e.target.closest(".mc-card");if(b)select(+b.dataset.n,true,true)});
  document.addEventListener("keydown",e=>{if(e.target.closest("input,select,textarea,summary"))return;if(e.key==="ArrowLeft"&&cur>1)select(cur-1,true);if(e.key==="ArrowRight"&&cur<WEEKS.length)select(cur+1,true)});
  window.addEventListener("hashchange",()=>{const m=/^#mc-(\d+)$/.exec(location.hash);if(m&&+m[1]!==cur)select(+m[1],false)});

  seasonChart();
  const m=/^#mc-(\d+)$/.exec(location.hash);
  select(m?Math.min(Math.max(+m[1],1),WEEKS.length):WEEKS.length,false);
  document.getElementById("foot").textContent=`Datos de Garmin Connect, actualizados el ${new Date(S.updated).toLocaleString("es-ES",{day:"numeric",month:"short",year:"numeric"})}. En el remo indoor el reloj no guarda metros ni vatios salvo cuando se conecta al ergómetro.`;
}

function seasonChart(){
  const used=ORDER.filter(k=>ACTS.some(a=>a.k===k));
  const ds=used.map(k=>({type:"bar",label:SPORTS[k].label,stack:"t",yAxisID:"y",backgroundColor:css(SPORTS[k].c),borderRadius:2,
    data:WEEKS.map(w=>+(sum(w.acts.filter(a=>a.k===k),a=>a.dur)/3600).toFixed(2))}));
  ds.push({type:"line",label:"Carga",yAxisID:"y2",data:WEEKS.map(w=>Math.round(sum(w.acts,a=>a.load))),borderColor:css("--ink"),backgroundColor:css("--ink"),borderWidth:1.8,pointRadius:WEEKS.length>30?0:3,pointHoverRadius:5,tension:0});
  const o=baseOpts();
  o.scales.x.stacked=true;o.scales.y.stacked=true;o.scales.x.grid.display=false;o.scales.x.ticks.maxTicksLimit=26;o.scales.x.ticks.autoSkip=true;o.scales.x.ticks.maxRotation=0;o.scales.x.title={display:true,text:"microciclo",color:css("--muted"),font:{size:10}};
  o.scales.y.title={display:true,text:"horas",color:css("--muted"),font:{size:10}};
  o.scales.y2={position:"right",grid:{display:false},ticks:{color:css("--muted"),font:{size:10}},title:{display:true,text:"carga",color:css("--muted"),font:{size:10}}};
  o.plugins.tooltip={displayColors:true,filter:i=>i.raw>0,callbacks:{title:it=>{const w=WEEKS[it[0].dataIndex];return `Microciclo ${w.n} · ${fd(w.from)} – ${fd(w.to)}`},label:i=>i.dataset.yAxisID==="y2"?` Carga: ${i.raw}`:` ${i.dataset.label}: ${hm(i.raw*3600)}`}};
  o.onClick=(e,els,ch)=>{const p=ch.getElementsAtEventForMode(e,"index",{intersect:false},false);if(p.length)select(p[0].index+1,true,true)};
  o.onHover=(e,els)=>{e.native.target.style.cursor=els.length?"pointer":"default"};
  o.plugins.selBg=true;
  const sel={id:"sel",beforeDatasetsDraw(ch){if(!cur)return;const x=ch.scales.x,a=ch.chartArea,w=x.width/WEEKS.length,cx=x.getPixelForValue(cur-1);
    const c=ch.ctx;c.save();c.fillStyle=css("--sunk");c.fillRect(cx-w/2,a.top,w,a.bottom-a.top);c.restore()}};
  mkChart("season",document.getElementById("season-cv"),{data:{labels:WEEKS.map(w=>String(w.n)),datasets:ds},options:o,plugins:[sel]});
}

function select(n,user,scroll){
  if(n<1||n>WEEKS.length)return;
  cur=n;const w=WEEKS[n-1];
  document.querySelectorAll(".mc-card").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===n?"true":"false"));
  if(user&&location.hash!=="#mc-"+n)history.replaceState(null,"","#mc-"+n);
  const live=todayUTC>=w.from&&todayUTC<=w.to;
  document.getElementById("mc-title").textContent=`Microciclo ${n}`;
  document.getElementById("mc-dates").innerHTML=`${fd(w.from)} – ${fd(w.to)} ${new Date(w.to).getUTCFullYear()}${live?'<span class="pill">En curso</span>':""}`;
  const tot=sum(w.acts,a=>a.dur),load=sum(w.acts,a=>a.load),kcal=sum(w.acts,a=>a.kcal),days=new Set(w.acts.map(a=>a.start.slice(0,10))).size;
  document.getElementById("mc-tiles").innerHTML=[
    ["Tiempo",hm(tot),"",""],["Carga",Math.round(load),"",""],["Sesiones",w.acts.length,"",""],
    ["Días entrenados",days,"/ 7",""],["Distancia",nf(sum(w.acts,a=>a.dist)/1000,1),"km",""],["Calorías",nf(kcal),"kcal",""]
  ].map(([l,v,u,d])=>`<div class="tile"><span>${l}</span><b>${v}${u?`<small>${u}</small>`:""}</b>${d}</div>`).join("");
  const by={};w.acts.forEach(a=>{const s=by[a.k]||(by[a.k]={n:0,dur:0,dist:0});s.n++;s.dur+=a.dur;s.dist+=a.dist||0});
  document.getElementById("mc-chips").innerHTML=ORDER.filter(k=>by[k]).map(k=>{const s=by[k];const d=s.dist>0?" · "+(isRow(k)?nf(Math.round(s.dist))+" m":nf(s.dist/1000,1)+" km"):"";
    return `<span class="chip"><i class="dot" style="background:var(${SPORTS[k].c})"></i>${SPORTS[k].label}: ${s.n} · ${hm(s.dur)}${d}</span>`}).join("")||'<span class="hint">Sin sesiones esta semana.</span>';
  // carga por día
  const ds=ORDER.filter(k=>by[k]).map(k=>({label:SPORTS[k].label,backgroundColor:css(SPORTS[k].c),borderRadius:3,
    data:DOWS.map((_,i)=>Math.round(sum(w.acts.filter(a=>a.k===k&&Math.round((dUTC(a.start)-w.from)/DAY)===i),a=>a.load)))}));
  const o=baseOpts();o.scales.x.stacked=o.scales.y.stacked=true;o.scales.x.grid.display=false;o.plugins.tooltip={displayColors:true,filter:i=>i.raw>0};
  o.scales.y.title={display:true,text:"carga",color:css("--muted"),font:{size:10}};
  mkChart("week",document.getElementById("week-cv"),{type:"bar",data:{labels:["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],datasets:ds},options:o});
  // días
  const groups={};w.acts.forEach(a=>(groups[a.start.slice(0,10)]||=[]).push(a));
  const chev=`<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>`;
  document.getElementById("mc-days").innerHTML=Object.keys(groups).sort().map(d=>{const t=dUTC(d),g=groups[d];
    return `<div class="day"><div class="day-h"><h3>${DOW[Math.round((t-w.from)/DAY)]} ${fd(t)}</h3><span>${g.length} ${g.length>1?"sesiones":"sesión"} · ${hm(sum(g,a=>a.dur))}</span></div><div class="acts">${g.map(a=>{
      const sp=SPORTS[a.k],dist=a.dist>0?(isRow(a.k)?nf(Math.round(a.dist))+" m":nf(a.dist/1000,2)+" km"):null;
      return `<details class="act" data-id="${a.id}"><summary>
        <i class="bar" style="background:var(${sp.c})"></i>
        <div class="a-name">${sp.label}<small>${a.start.slice(11)}</small></div>
        <div class="a-cell mono">${hms(a.dur)}<small>tiempo</small></div>
        <div class="a-cell hide-xs">${dist??'<span class="nodata">sin dato</span>'}<small>distancia</small></div>
        <div class="a-cell hide-sm">${paceTxt(a)??"—"}<small>${isRow(a.k)&&a.spd>0?nf(a.spd*3.6,1)+" km/h":sp.pace?"ritmo":"velocidad"}</small></div>
        <div class="a-cell">${a.hr??"—"} / ${a.hrmax??"—"}<small>FC med / máx</small></div>
        <div class="a-cell hide-sm">${a.load!=null?Math.round(a.load):"—"}<small>carga</small></div>
        ${chev}</summary><div class="detail"></div></details>`}).join("")}</div></div>`}).join("")||'<p class="hint">Sin sesiones esta semana.</p>';
  document.querySelectorAll("#mc-days details.act").forEach(el=>el.addEventListener("toggle",()=>{if(el.open&&!el.dataset.r){el.dataset.r=1;openAct(el)}}));
  if(charts.season)charts.season.update("none");
  if(scroll)document.getElementById("mc").scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}

function paceTxt(a,spd=a.spd){const sp=SPORTS[a.k];if(!(spd>0))return null;return sp.pace?hms(sp.pace/spd)+(sp.pace===500?" /500 m":" /km"):nf(spd*3.6,1)+" km/h"}
function cadU(a){return a.k==="run"?"ppm":isRow(a.k)?"pal/min":"rpm"}
function tile(l,v,u=""){return v==null||v===""?"":`<div class="tile"><span>${l}</span><b>${v}${u?`<small>${u}</small>`:""}</b></div>`}

async function getDet(n){if(!detCache[n])detCache[n]=new Promise((ok,ko)=>{window.__D=window.__D||{};if(window.__D[n])return ok(window.__D[n]);const sc=document.createElement("script");sc.src=`data/mc-${n}.js`;sc.onload=()=>ok(window.__D[n]);sc.onerror=()=>ko(new Error("no se pudo cargar"));document.head.appendChild(sc)});return detCache[n]}
async function openAct(el){
  const a=ACTS.find(x=>x.id===el.dataset.id),d=el.querySelector(".detail"),sp=SPORTS[a.k],row=isRow(a.k);
  const pu=sp.pace?(sp.pace===500?"/500 m":"/km"):"km/h";
  d.innerHTML=`<a class="gc-link" href="https://connect.garmin.com/modern/activity/${a.id}" target="_blank" rel="noopener">Abrir en Garmin Connect<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4 10l6-6M5 4h5v5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a>
  <div class="dtiles">${[
    tile("Tiempo",hms(a.dur)),
    tile("Distancia",a.dist>0?(row?nf(Math.round(a.dist)):nf(a.dist/1000,2)):null,row?"m":"km"),
    row?tile("Velocidad media",a.spd>0?nf(a.spd*3.6,1):null,"km/h"):"",row?tile("Velocidad máx.",a.spdmax>0?nf(a.spdmax*3.6,1):null,"km/h"):"",
    tile(sp.pace?"Ritmo medio":"Velocidad media",a.spd>0?(sp.pace?hms(sp.pace/a.spd):nf(a.spd*3.6,1)):null,pu),
    tile(sp.pace?"Mejor ritmo":"Velocidad máx.",a.spdmax>0&&a.k!=="other"?(sp.pace?hms(sp.pace/a.spdmax):nf(a.spdmax*3.6,1)):null,pu),
    tile("FC media",a.hr,"ppm"),tile("FC máxima",a.hrmax,"ppm"),
    tile(row?"Ritmo de palada":"Cadencia",a.cad||null,cadU(a)),tile(row?"Ritmo de palada máx.":"Cadencia máx.",a.cadmax||null,cadU(a)),
    tile("Paladas",a.strokes),tile("Metros por palada",a.strokelen?nf(a.strokelen,2):null,"m"),
    tile("Potencia media",a.pwr,"W"),tile("Potencia máx.",a.pwrmax,"W"),tile("Potencia normalizada",a.np,"W"),
    tile("Desnivel +",a.asc,"m"),tile("Desnivel −",a.desc,"m"),
    tile("Zancada",a.steplen?nf(a.steplen/100,2):null,"m"),tile("Oscilación vertical",a.vo?nf(a.vo,1):null,"cm"),
    tile("Contacto con el suelo",a.gct,"ms"),tile("Ratio vertical",a.vr?nf(a.vr,1):null,"%"),
    tile("Respiración media",a.resp?Math.round(a.resp):null,"rpm"),tile("Respiración máx.",a.respmax?Math.round(a.respmax):null,"rpm"),
    tile("Efecto aeróbico",a.te!=null?nf(a.te,1):null),tile("Efecto anaeróbico",a.tean!=null?nf(a.tean,1):null),
    tile("Carga",a.load!=null?Math.round(a.load):null),tile("Calorías",a.kcal,"kcal")].join("")}</div>
  <p class="loading">Cargando gráficas…</p>`;
  let det;try{det=(await getDet(a.mc))[a.id]}catch(e){d.querySelector(".loading").textContent="No se pudieron cargar las gráficas. Cierra y vuelve a abrir la sesión.";delete detCache[a.mc];el.dataset.r="";return}
  d.querySelector(".loading").remove();
  const s=det.series||{},T=s.t||[],xl=T.map(x=>hms(x)),list=[];
  if(s.hr)list.push({k:"hr",t:"Frecuencia cardiaca (ppm)",d:s.hr,c:"--s-erg"});
  if(s.spd){if(sp.pace){const lim=a.k==="run"?1.2:.8;list.push({k:"pace",t:row?`Ritmo (${pu}) · velocidad (km/h)`:`Ritmo (${pu})`,d:s.spd.map(v=>v>lim?sp.pace/v:null),c:sp.c,pace:true})}
    else list.push({k:"spd",t:"Velocidad (km/h)",d:s.spd.map(v=>v==null?null:+(v*3.6).toFixed(1)),c:sp.c})}
  if(s.cad)list.push({k:"cad",t:`${row?"Ritmo de palada":"Cadencia"} (${cadU(a)})`,d:s.cad.map(v=>v||null),c:"--accent"});
  if(s.pwr)list.push({k:"pwr",t:"Potencia (W)",d:s.pwr,c:"--s-bike"});
  if(s.alt)list.push({k:"alt",t:"Altitud (m)",d:s.alt,c:"--s-hike",fill:true});
  if(s.resp)list.push({k:"resp",t:"Respiración (rpm)",d:s.resp.map(v=>v==null?null:Math.round(v)),c:"--s-water"});
  const route=det.track&&det.track.length>2?routeSVG(det.track,css(sp.c)):"";
  d.insertAdjacentHTML("beforeend",`<div class="charts">${list.map(c=>`<div class="chart"><h4>${c.t}</h4><div class="cv"><canvas data-k="${c.k}"></canvas></div></div>`).join("")}${route?`<div class="chart"><h4>Recorrido</h4>${route}</div>`:""}</div>
    ${a.k==="erg"&&!(a.dist>0)?'<p class="nodata" style="margin:10px 0 0">El reloj no guardó metros ni vatios en esta sesión: están en la foto del monitor.</p>':""}
    ${det.laps&&det.laps.length?lapsHTML(a,det.laps):""}`);
  if(!window.Chart)return;
  list.forEach(c=>{const col=css(c.c),o=baseOpts();
    if(matchMedia("(max-width:520px)").matches)o.scales.x.ticks.maxTicksLimit=5;
    if(c.pace||c.k==="spd"||c.k==="cad"){const r=rango(c.d,c.pace?[5,10,15,20,30,60,120,300,600]:c.k==="cad"?[1,2,5,10,20,50]:[.5,1,2,2.5,5,10,20]);if(r){o.scales.y.min=r.lo;o.scales.y.max=r.hi;o.scales.y.ticks.stepSize=r.step;
      // remo: a la derecha, los mismos puntos del eje en km/h
      if(c.pace&&row)o.scales.y2={position:"right",reverse:true,min:r.lo,max:r.hi,grid:{display:false},ticks:{stepSize:r.step,color:css(c.c),font:{size:10},callback:v=>v>0?nf(sp.pace/v*3.6,1):""}}}}
    if(c.pace){o.scales.y.reverse=true;o.scales.y.ticks.callback=v=>hms(v);o.plugins.tooltip.callbacks={label:i=>i.raw==null?"":hms(i.raw)+(row?" · "+nf(sp.pace/i.raw*3.6,1)+" km/h":"")}}
    new Chart(d.querySelector(`canvas[data-k="${c.k}"]`),{type:"line",data:{labels:xl,datasets:[{data:c.d,borderColor:col,backgroundColor:col+"30",fill:c.fill?"start":false,borderWidth:1.6,pointRadius:0,tension:.25,spanGaps:true}]},options:o})});
}
// Eje con saltos redondos y sin que un pico suelto aplaste la línea (ignora el 5 % más extremo de cada lado)
function rango(d,pasos){const v=d.filter(x=>x!=null&&isFinite(x)).sort((a,b)=>a-b);if(v.length<10)return null;
  let a=v[Math.floor(v.length*.05)],b=v[Math.ceil(v.length*.95)-1];const m=Math.max((b-a)*.25,pasos[0]);a-=m;b+=m;
  const step=pasos.find(p=>(b-a)/p<=5)||pasos.at(-1);return{lo:Math.max(0,Math.floor(a/step)*step),hi:Math.ceil(b/step)*step,step}}
function routeSVG(tr,col){
  const la=tr.map(p=>p[0]),lo=tr.map(p=>p[1]),k=Math.cos((Math.min(...la)+Math.max(...la))/2*Math.PI/180),xs=lo.map(v=>v*k);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...la),y1=Math.max(...la),W=300,H=150,p=10;
  const sc=Math.min((W-2*p)/((x1-x0)||1e-9),(H-2*p)/((y1-y0)||1e-9)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  const P=xs.map((x,i)=>[(ox+(x-x0)*sc).toFixed(1),(H-oy-(la[i]-y0)*sc).toFixed(1)]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Forma del recorrido"><polyline points="${P.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="4" fill="${css("--up")}"/><circle cx="${P.at(-1)[0]}" cy="${P.at(-1)[1]}" r="4" fill="${css("--down")}"/></svg>`;
}
function lapsHTML(a,laps){
  const sp=SPORTS[a.k],row=isRow(a.k),hp=laps.some(l=>l.pwr),ha=laps.some(l=>l.asc);
  return `<div class="laps"><h4>Vueltas</h4><table><thead><tr><th>Vuelta</th><th>Tiempo</th><th>Distancia</th>${row?"<th>km/h</th>":""}<th>${sp.pace?"Ritmo":"Velocidad"}</th><th>FC med</th><th>FC máx</th><th>${row?"Pal/min":"Cadencia"}</th>${hp?"<th>Potencia</th>":""}${ha?"<th>Desnivel +</th>":""}<th>kcal</th></tr></thead><tbody>
  ${laps.map((l,i)=>`<tr><td>${i+1}</td><td class="mono">${hms(l.t)}</td><td>${l.d>0?(row?nf(Math.round(l.d))+" m":nf(l.d/1000,2)+" km"):"—"}</td>${row?`<td>${l.spd>0?nf(l.spd*3.6,1):"—"}</td>`:""}<td>${l.spd>0?(sp.pace?hms(sp.pace/l.spd):nf(l.spd*3.6,1)):"—"}</td><td>${l.hr??"—"}</td><td>${l.hrmax??"—"}</td><td>${l.cad||"—"}</td>${hp?`<td>${l.pwr??"—"}</td>`:""}${ha?`<td>${l.asc??"—"}</td>`:""}<td>${l.kcal??"—"}</td></tr>`).join("")}</tbody></table></div>`;
}
</script>
